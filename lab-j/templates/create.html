{% extends "layout.html" %}

{% block title %}Dodaj grę{% endblock %}
{% block body_class %}edit{% endblock %}

{% block content %}
<h1>Dodaj grę</h1>

<form action="{{ url_for('create') }}" method="post" class="edit-form">
    <div class="form-group">
        <label for="title">Tytuł</label>
        <input type="text" id="title" name="title" required>
    </div>

    <div class="form-group">
        <label for="platform">Platforma</label>
        <input type="text" id="platform" name="platform" required>
    </div>

    <div class="form-group">
        <label for="genre">Gatunek</label>
        <input type="text" id="genre" name="genre" required>
    </div>

    <div class="form-group">
        <label for="release_year">Rok wydania</label>
        <input type="number" id="release_year" name="release_year">
    </div>

    <div class="form-group">
        <label></label>
        <input type="submit" value="Zapisz">
    </div>
</form>

<a href="{{ url_for('index') }}">Wróć do listy</a>
{% endblock %}
